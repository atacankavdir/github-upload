<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Dutch Vocabulary Flashcards</title>
  <style>
    :root {
      --bg-start: #f6f9ff;
      --bg-end: #eaf3ff;
      --card-front: #ffffff;
      --card-back: #0f1f38;
      --card-border: #d8e2f1;
      --text-main: #13233a;
      --text-light: #f2f7ff;
      --text-muted: #455873;
      --accent: #2f6feb;
      --shadow: 0 14px 35px rgba(16, 32, 56, 0.16);
      --radius: 20px;
      --btn-bg: #ffffff;
      --btn-text: #11243f;
      --btn-border: #d7e1f0;
      --btn-hover-border: #b9c9e0;
      --btn-hover-shadow: 0 8px 20px rgba(17, 36, 63, 0.1);
      --practice-bg: #fff2ec;
      --practice-text: #7b2f1d;
      --practice-border: #e5b19a;
      --practice-hover-border: #d18260;
      --practice-hover-shadow: 0 8px 20px rgba(170, 80, 48, 0.18);
      --reset-bg: #f5f7fb;
      --reset-text: #374a67;
      --reset-border: #c8d5ea;
      --example-bg: #eef3fb;
      --example-text: #2e4363;
      --example-border: #cfdbee;
    }

    /* Dark mode uses the same variables with different values. */
    body.dark-mode {
      --bg-start: #0d1420;
      --bg-end: #121c2c;
      --card-front: #1a263b;
      --card-back: #0b1322;
      --card-border: #324864;
      --text-main: #e6eefc;
      --text-light: #f4f7ff;
      --text-muted: #b9c7dd;
      --accent: #7ea5ff;
      --shadow: 0 14px 35px rgba(0, 0, 0, 0.45);
      --btn-bg: #1a263b;
      --btn-text: #e6eefc;
      --btn-border: #30415d;
      --btn-hover-border: #49648f;
      --btn-hover-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      --practice-bg: #3a1f24;
      --practice-text: #ffd4c9;
      --practice-border: #7f4a56;
      --practice-hover-border: #ad6677;
      --practice-hover-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      --reset-bg: #152238;
      --reset-text: #d6e3f8;
      --reset-border: #2f4668;
      --example-bg: #17263e;
      --example-text: #d6e4fb;
      --example-border: #2f486a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: linear-gradient(150deg, var(--bg-start), var(--bg-end));
      color: var(--text-main);
      font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }

    .app {
      width: min(620px, 100%);
      text-align: center;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(1.4rem, 4vw, 1.9rem);
      font-weight: 700;
    }

    .hint {
      margin: 0 0 20px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .card-scene {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      perspective: 1000px;
    }

    .card {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      min-height: 250px;
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 420ms ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .card.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 24px;
      border-radius: var(--radius);
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .card-front {
      background: var(--card-front);
      color: var(--text-main);
    }

    .card-back {
      background: var(--card-back);
      color: var(--text-light);
      transform: rotateY(180deg);
    }

    .label {
      margin: 0;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.78;
    }

    .word {
      margin: 0;
      font-size: clamp(1.8rem, 7vw, 2.7rem);
      font-weight: 700;
      line-height: 1.15;
      text-wrap: balance;
    }

    .index {
      margin: 16px 0 18px;
      font-size: 0.98rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .top-controls {
      width: 100%;
      max-width: 460px;
      margin: 0 auto 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .mode-switch {
      width: 100%;
      max-width: 460px;
      margin: 0 auto 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .source-filter {
      width: 100%;
      max-width: 460px;
      margin: 0 auto 14px;
      text-align: left;
    }

    .source-filter-title {
      margin: 0 0 6px;
      color: var(--text-muted);
      font-size: 0.82rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .source-filter-dropdown {
      border: 1px solid var(--btn-border);
      border-radius: 12px;
      background: var(--btn-bg);
      color: var(--text-main);
      padding: 8px 10px;
    }

    .source-filter-dropdown > summary {
      list-style: none;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      user-select: none;
    }

    .source-filter-dropdown > summary::-webkit-details-marker {
      display: none;
    }

    .source-filter-options {
      margin-top: 10px;
      max-height: 190px;
      overflow-y: auto;
      border-top: 1px solid var(--btn-border);
      padding-top: 10px;
      display: grid;
      gap: 8px;
    }

    .source-filter-option {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.94rem;
      color: var(--text-main);
    }

    .source-filter-option input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .mode-btn.is-active {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent);
    }

    .primary-actions {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      flex-wrap: nowrap;
    }

    .primary-actions button {
      flex: 1 1 0;
      min-width: 0;
    }

    .bottom-actions {
      margin-top: 12px;
      display: flex;
      justify-content: center;
    }

    .example-controls {
      margin: 0 auto 10px;
      display: flex;
      justify-content: center;
    }

    .example-box {
      width: 100%;
      max-width: 460px;
      margin: 0 auto 14px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--example-border);
      background: var(--example-bg);
      color: var(--example-text);
      font-size: 0.92rem;
      line-height: 1.4;
      text-align: left;
    }

    .example-box p {
      margin: 0;
    }

    .quiz-panel {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid var(--card-border);
      background: var(--card-front);
      box-shadow: var(--shadow);
      text-align: left;
    }

    .quiz-label {
      margin: 0 0 6px;
      color: var(--text-muted);
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .quiz-word {
      margin: 0 0 10px;
      color: var(--text-main);
      font-size: clamp(1.4rem, 6vw, 2rem);
      font-weight: 700;
    }

    .quiz-progress {
      margin: 0 0 12px;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .quiz-answer-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .quiz-answer-input {
      flex: 1 1 0;
      min-height: 44px;
      border: 1px solid var(--btn-border);
      border-radius: 12px;
      background: var(--btn-bg);
      color: var(--text-main);
      padding: 10px 12px;
      font-size: 1rem;
    }

    .quiz-answer-input:focus {
      outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent);
      outline-offset: 1px;
    }

    .quiz-feedback {
      margin: 12px 0 0;
      min-height: 20px;
      color: var(--text-main);
      font-size: 0.92rem;
      font-weight: 600;
    }

    .quiz-complete {
      margin-top: 12px;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--example-border);
      background: var(--example-bg);
      color: var(--example-text);
    }

    .quiz-complete p {
      margin: 0 0 10px;
      font-weight: 700;
    }

    .quiz-complete-stats {
      margin: 0 0 10px;
      font-weight: 600;
    }

    button {
      min-width: 118px;
      min-height: 44px;
      padding: 10px 18px;
      border: 1px solid var(--btn-border);
      border-radius: 12px;
      background: var(--btn-bg);
      color: var(--btn-text);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover {
      border-color: var(--btn-hover-border);
      box-shadow: var(--btn-hover-shadow);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
      box-shadow: none;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .example-btn {
      min-width: 140px;
    }

    .practice-btn {
      background: var(--practice-bg);
      color: var(--practice-text);
      border-color: var(--practice-border);
    }

    .practice-btn:hover {
      border-color: var(--practice-hover-border);
      box-shadow: var(--practice-hover-shadow);
    }

    .reset-btn {
      min-width: 160px;
      background: var(--reset-bg);
      color: var(--reset-text);
      border-color: var(--reset-border);
      font-size: 0.92rem;
    }

    .card:focus-visible,
    button:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 40%, transparent);
      outline-offset: 3px;
    }

    @media (max-width: 480px) {
      .card {
        min-height: 230px;
      }

      .quiz-answer-row {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="top-controls">
      <button id="themeToggleBtn" type="button">Dark mode</button>
      <button id="shuffleBtn" type="button">Shuffle</button>
    </div>

    <h1>Dutch Flashcards</h1>
    <p class="hint">Tap or click the card to flip it.</p>

    <!-- ADDED (Source filter):
         Multi-select source filter with "All" option at the top. -->
    <div class="source-filter">
      <p class="source-filter-title">Source Filter</p>
      <details id="sourceFilterDropdown" class="source-filter-dropdown">
        <summary id="sourceFilterSummary">All sources</summary>
        <div id="sourceFilterOptions" class="source-filter-options"></div>
      </details>
    </div>

    <!-- ADDED (Quiz mode):
         Simple mode switch between flashcards and quiz. -->
    <div class="mode-switch">
      <button id="flashcardModeBtn" class="mode-btn is-active" type="button">Flashcard</button>
      <button id="quizModeBtn" class="mode-btn" type="button">Quiz</button>
    </div>

    <div id="cardScene" class="card-scene">
      <button id="flashcard" class="card" type="button" aria-label="Flashcard. Tap to flip.">
        <div class="card-face card-front">
          <p class="label">Dutch</p>
          <p id="dutchWord" class="word">huis</p>
        </div>
        <div class="card-face card-back">
          <p class="label">English</p>
          <p id="englishWord" class="word">house</p>
        </div>
      </button>
    </div>

    <!-- ADDED (Quiz mode):
         Static quiz area (no card flip) for typed English answers. -->
    <div id="quizPanel" class="quiz-panel" hidden>
      <p class="quiz-label">Dutch word</p>
      <p id="quizDutchWord" class="quiz-word">huis</p>
      <p id="quizProgress" class="quiz-progress">Question 1 of 10</p>

      <div class="quiz-answer-row">
        <input
          id="quizAnswerInput"
          class="quiz-answer-input"
          type="text"
          placeholder="Type English answer"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        >
        <button id="checkAnswerBtn" type="button">Check</button>
      </div>

      <p id="quizFeedback" class="quiz-feedback" aria-live="polite"></p>

      <div id="quizCompleteBox" class="quiz-complete" hidden>
        <p>Quiz complete!</p>
        <p id="quizCompleteStats" class="quiz-complete-stats"></p>
        <button id="restartQuizBtn" type="button">Start New 10-Question Quiz</button>
      </div>
    </div>

    <p id="cardIndex" class="index">Card 1 of 5</p>

    <div id="exampleBox" class="example-box" hidden>
      <p id="exampleText"></p>
    </div>

    <div class="example-controls">
      <button id="exampleBtn" class="example-btn" type="button">Example</button>
    </div>

    <div class="primary-actions">
      <button id="prevBtn" type="button">Previous</button>
      <button id="nextTimeBtn" class="practice-btn" type="button">Next time!</button>
      <button id="nextBtn" type="button">Next</button>
    </div>

    <div class="bottom-actions">
      <button id="resetProgressBtn" class="reset-btn" type="button">Reset Progress</button>
    </div>
  </main>

  <script>
    // ---------------------------------------------
    // Config values you can tweak later
    // ---------------------------------------------
    const THEME_STORAGE_KEY = "dutchFlashcardsTheme";
    const PROGRESS_STORAGE_KEY = "dutchFlashcardsProgressV1";

    // Bucket selection probabilities (must sum to 100).
    const BUCKET_WEIGHTS = {
      1: 60,
      2: 25,
      3: 15
    };

    // Cooldown length: avoid reusing the last N shown words when possible.
    const COOLDOWN_LENGTH = 2;

    // Quiz session length: change this number to make quiz sessions shorter/longer.
    const QUIZ_SESSION_LENGTH = 10;

    // ---------------------------------------------
    // Fallback data (used if data/words.json fails)
    // ---------------------------------------------
    // ADDED (Example sentences):
    // Each word now includes exampleDutch for optional sentence practice.
    const fallbackWords = [
      { id: 1, dutch: "huis", english: "house", count: 0, exampleDutch: "Ik ga naar huis.", sourceFile: "fallback", sourceFiles: ["fallback"] },
      { id: 2, dutch: "boek", english: "book", count: 0, exampleDutch: "Ik lees een boek.", sourceFile: "fallback", sourceFiles: ["fallback"] },
      { id: 3, dutch: "water", english: "water", count: 0, exampleDutch: "Ik drink water.", sourceFile: "fallback", sourceFiles: ["fallback"] },
      { id: 4, dutch: "fiets", english: "bicycle", count: 0, exampleDutch: "Mijn fiets is nieuw.", sourceFile: "fallback", sourceFiles: ["fallback"] },
      { id: 5, dutch: "appel", english: "apple", count: 0, exampleDutch: "Ik eet een appel.", sourceFile: "fallback", sourceFiles: ["fallback"] }
    ];

    // ---------------------------------------------
    // State
    // ---------------------------------------------
    let baseWords = [];
    let defaultWords = [];
    let words = [];
    let currentWordIndex = 0;
    let shownHistoryIds = [];
    let recentWordIds = [];
    const ALL_SOURCE_VALUE = "__all_sources__";
    let selectedSources = new Set([ALL_SOURCE_VALUE]);
    // ADDED (Example sentences):
    // Example sentence is hidden by default for each word.
    let isExampleVisible = false;

    // ADDED (Quiz mode):
    // Track mode and quiz session state.
    let currentMode = "flashcard"; // "flashcard" or "quiz"
    let isQuizChecked = false;
    let wasQuizAnswerCorrect = false;
    let quizCompletedCount = 0;
    let quizCorrectCount = 0;
    let quizWrongCount = 0;
    let isQuizComplete = false;

    // ---------------------------------------------
    // DOM references
    // ---------------------------------------------
    const flashcard = document.getElementById("flashcard");
    const cardScene = document.getElementById("cardScene");
    const dutchWord = document.getElementById("dutchWord");
    const englishWord = document.getElementById("englishWord");
    const cardIndex = document.getElementById("cardIndex");
    const sourceFilterSummary = document.getElementById("sourceFilterSummary");
    const sourceFilterOptions = document.getElementById("sourceFilterOptions");
    const flashcardModeBtn = document.getElementById("flashcardModeBtn");
    const quizModeBtn = document.getElementById("quizModeBtn");
    const quizPanel = document.getElementById("quizPanel");
    const quizDutchWord = document.getElementById("quizDutchWord");
    const quizProgress = document.getElementById("quizProgress");
    const quizAnswerInput = document.getElementById("quizAnswerInput");
    const checkAnswerBtn = document.getElementById("checkAnswerBtn");
    const quizFeedback = document.getElementById("quizFeedback");
    const quizCompleteBox = document.getElementById("quizCompleteBox");
    const quizCompleteStats = document.getElementById("quizCompleteStats");
    const restartQuizBtn = document.getElementById("restartQuizBtn");
    const exampleBtn = document.getElementById("exampleBtn");
    const exampleBox = document.getElementById("exampleBox");
    const exampleText = document.getElementById("exampleText");

    const themeToggleBtn = document.getElementById("themeToggleBtn");
    const prevBtn = document.getElementById("prevBtn");
    const shuffleBtn = document.getElementById("shuffleBtn");
    const nextTimeBtn = document.getElementById("nextTimeBtn");
    const nextBtn = document.getElementById("nextBtn");
    const resetProgressBtn = document.getElementById("resetProgressBtn");

    // ---------------------------------------------
    // Utility helpers
    // ---------------------------------------------
    function cloneWords(wordList) {
      return wordList.map(function (word) {
        return {
          id: word.id,
          dutch: word.dutch,
          english: word.english,
          count: word.count,
          exampleDutch: word.exampleDutch || "",
          sourceFile: word.sourceFile || "unknown",
          sourceFiles: Array.isArray(word.sourceFiles) && word.sourceFiles.length > 0
            ? [...word.sourceFiles]
            : [word.sourceFile || "unknown"]
        };
      });
    }

    function randomFromArray(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    // ADDED (Example sentences):
    // If a word has no explicit example, create a simple Dutch sentence.
    function buildDefaultExampleSentence(dutchWord) {
      return `Ik oefen het woord "${dutchWord}".`;
    }

    // ---------------------------------------------
    // Source filter helpers
    // ---------------------------------------------
    function normalizeSourceFields(item) {
      const sourcesFromArray = Array.isArray(item.sourceFiles)
        ? item.sourceFiles
            .filter(function (sourceName) {
              return typeof sourceName === "string";
            })
            .map(function (sourceName) {
              return sourceName.trim();
            })
            .filter(Boolean)
        : [];

      const primarySource =
        typeof item.sourceFile === "string" ? item.sourceFile.trim() : "";

      const combined = sourcesFromArray.slice();
      if (primarySource) combined.unshift(primarySource);

      const uniqueSources = Array.from(new Set(combined)).filter(Boolean);
      const safeSources = uniqueSources.length > 0 ? uniqueSources : ["unknown"];

      return {
        sourceFile: safeSources[0],
        sourceFiles: safeSources
      };
    }

    function getSortedSourceList() {
      const sourceSet = new Set();

      baseWords.forEach(function (word) {
        word.sourceFiles.forEach(function (sourceName) {
          sourceSet.add(sourceName);
        });
      });

      return Array.from(sourceSet).sort(function (a, b) {
        return a.localeCompare(b);
      });
    }

    function updateSourceFilterSummary() {
      if (selectedSources.has(ALL_SOURCE_VALUE)) {
        sourceFilterSummary.textContent = "All sources";
        return;
      }

      const selectedList = Array.from(selectedSources);

      if (selectedList.length === 1) {
        sourceFilterSummary.textContent = selectedList[0];
        return;
      }

      sourceFilterSummary.textContent = `${selectedList.length} sources selected`;
    }

    function syncSourceFilterCheckboxes() {
      const checkboxes = sourceFilterOptions.querySelectorAll('input[type="checkbox"][name="sourceFilter"]');

      checkboxes.forEach(function (checkbox) {
        if (checkbox.value === ALL_SOURCE_VALUE) {
          checkbox.checked = selectedSources.has(ALL_SOURCE_VALUE);
        } else {
          checkbox.checked =
            !selectedSources.has(ALL_SOURCE_VALUE) &&
            selectedSources.has(checkbox.value);
        }
      });
    }

    function renderSourceFilterOptions() {
      const sourceNames = getSortedSourceList();
      sourceFilterOptions.innerHTML = "";

      function appendOption(value, labelText) {
        const label = document.createElement("label");
        label.className = "source-filter-option";

        const input = document.createElement("input");
        input.type = "checkbox";
        input.name = "sourceFilter";
        input.value = value;

        const text = document.createElement("span");
        text.textContent = labelText;

        label.appendChild(input);
        label.appendChild(text);
        sourceFilterOptions.appendChild(label);
      }

      // Keep "All" at the top.
      appendOption(ALL_SOURCE_VALUE, "All");
      sourceNames.forEach(function (sourceName) {
        appendOption(sourceName, sourceName);
      });

      syncSourceFilterCheckboxes();
      updateSourceFilterSummary();
    }

    function wordMatchesSourceFilter(word) {
      if (selectedSources.has(ALL_SOURCE_VALUE)) return true;

      return word.sourceFiles.some(function (sourceName) {
        return selectedSources.has(sourceName);
      });
    }

    function applySourceFilter() {
      words = baseWords.filter(wordMatchesSourceFilter);

      // When the source filter changes, restart the active run from first card.
      resetSessionTracking();
      resetQuizSessionStats();
      resetQuizQuestionState();
      isExampleVisible = false;

      if (words.length === 0) {
        currentWordIndex = 0;
        renderCurrentView();
        return;
      }

      showWordAtIndex(0, { trackHistory: true, trackRecent: true });
    }

    function handleSourceFilterChange(event) {
      const target = event.target;
      if (!(target instanceof HTMLInputElement)) return;
      if (target.name !== "sourceFilter") return;

      if (target.value === ALL_SOURCE_VALUE) {
        // Selecting "All" clears individual source selections.
        selectedSources = new Set([ALL_SOURCE_VALUE]);
      } else {
        selectedSources.delete(ALL_SOURCE_VALUE);

        if (target.checked) {
          selectedSources.add(target.value);
        } else {
          selectedSources.delete(target.value);
        }

        if (selectedSources.size === 0) {
          // Never keep an empty filter.
          selectedSources = new Set([ALL_SOURCE_VALUE]);
        }
      }

      syncSourceFilterCheckboxes();
      updateSourceFilterSummary();
      applySourceFilter();
    }

    // ---------------------------------------------
    // Theme (dark mode)
    // ---------------------------------------------
    function applyTheme(theme) {
      const useDarkMode = theme === "dark";
      document.body.classList.toggle("dark-mode", useDarkMode);
      themeToggleBtn.textContent = useDarkMode ? "Light mode" : "Dark mode";
    }

    function loadSavedTheme() {
      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
      if (savedTheme === "dark" || savedTheme === "light") {
        applyTheme(savedTheme);
      } else {
        applyTheme("light");
      }
    }

    function toggleTheme() {
      const isDarkMode = document.body.classList.contains("dark-mode");
      const nextTheme = isDarkMode ? "light" : "dark";
      applyTheme(nextTheme);
      localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
    }

    // ---------------------------------------------
    // Progress persistence (localStorage)
    // ---------------------------------------------
    function readSavedProgressById() {
      try {
        const raw = localStorage.getItem(PROGRESS_STORAGE_KEY);
        if (!raw) return new Map();

        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return new Map();

        const countById = new Map();

        parsed.forEach(function (item) {
          const id = Number(item.id);
          const count = Number(item.count);

          if (Number.isInteger(id) && id > 0 && Number.isFinite(count)) {
            countById.set(id, Math.max(0, Math.floor(count)));
          }
        });

        return countById;
      } catch (error) {
        console.warn("Could not parse saved progress:", error);
        return new Map();
      }
    }

    function applySavedCounts(baseList) {
      const savedCounts = readSavedProgressById();

      return baseList.map(function (word) {
        return {
          id: word.id,
          dutch: word.dutch,
          english: word.english,
          count: savedCounts.has(word.id) ? savedCounts.get(word.id) : 0,
          exampleDutch: word.exampleDutch || "",
          sourceFile: word.sourceFile || "unknown",
          sourceFiles: Array.isArray(word.sourceFiles) && word.sourceFiles.length > 0
            ? [...word.sourceFiles]
            : [word.sourceFile || "unknown"]
        };
      });
    }

    function saveProgress() {
      // Save the full base deck so counts persist even when a source filter is active.
      localStorage.setItem(PROGRESS_STORAGE_KEY, JSON.stringify(baseWords));
    }

    // ---------------------------------------------
    // Bucket helpers
    // ---------------------------------------------
    // Bucket rules:
    // Count 0-1 => bucket 1
    // Count 2-3 => bucket 2
    // Count 4+  => bucket 3
    function getBucketFromCount(count) {
      if (count <= 1) return 1;
      if (count <= 3) return 2;
      return 3;
    }

    function buildBucketsByWordIndex(wordList) {
      const buckets = { 1: [], 2: [], 3: [] };

      wordList.forEach(function (word, index) {
        const bucket = getBucketFromCount(word.count);
        buckets[bucket].push(index);
      });

      return buckets;
    }

    function pickWeightedBucketId(bucketMap) {
      const availableBucketIds = [1, 2, 3].filter(function (bucketId) {
        return bucketMap[bucketId].length > 0;
      });

      if (availableBucketIds.length === 0) return null;

      let totalWeight = 0;
      availableBucketIds.forEach(function (bucketId) {
        totalWeight += BUCKET_WEIGHTS[bucketId];
      });

      let point = Math.random() * totalWeight;

      for (const bucketId of availableBucketIds) {
        point -= BUCKET_WEIGHTS[bucketId];
        if (point <= 0) return bucketId;
      }

      return availableBucketIds[availableBucketIds.length - 1];
    }

    // ---------------------------------------------
    // Cooldown + history helpers
    // ---------------------------------------------
    function resetSessionTracking() {
      shownHistoryIds = [];
      recentWordIds = [];
    }

    function pushShownHistory(wordId) {
      const lastId = shownHistoryIds[shownHistoryIds.length - 1];
      if (lastId !== wordId) {
        shownHistoryIds.push(wordId);
      }
    }

    function pushRecentWord(wordId) {
      recentWordIds.push(wordId);
      if (recentWordIds.length > COOLDOWN_LENGTH) {
        recentWordIds.shift();
      }
    }

    // ---------------------------------------------
    // Data loading
    // ---------------------------------------------
    function sanitizeWords(rawWords) {
      if (!Array.isArray(rawWords)) return [];

      return rawWords
        .filter(function (item) {
          return (
            item &&
            typeof item.dutch === "string" &&
            typeof item.english === "string"
          );
        })
        .map(function (item) {
          const cleanDutch = item.dutch.trim();
          const cleanEnglish = item.english.trim();
          const cleanExample =
            typeof item.exampleDutch === "string"
              ? item.exampleDutch.trim()
              : "";
          const sourceInfo = normalizeSourceFields(item);

          return {
            id: Number.isInteger(item.id) && item.id > 0 ? item.id : null,
            dutch: cleanDutch,
            english: cleanEnglish,
            // Ensure every Dutch word has an example sentence.
            exampleDutch: cleanExample || buildDefaultExampleSentence(cleanDutch),
            sourceFile: sourceInfo.sourceFile,
            sourceFiles: sourceInfo.sourceFiles
          };
        })
        .filter(function (item) {
          return item.dutch && item.english;
        });
    }

    function createWordObjectsFromPairs(wordPairs) {
      return wordPairs.map(function (pair, index) {
        return {
          id: Number.isInteger(pair.id) && pair.id > 0 ? pair.id : index + 1,
          dutch: pair.dutch,
          english: pair.english,
          count: 0,
          // Ensure every word object always has an example sentence.
          exampleDutch: pair.exampleDutch || buildDefaultExampleSentence(pair.dutch),
          sourceFile: pair.sourceFile || "unknown",
          sourceFiles: Array.isArray(pair.sourceFiles) && pair.sourceFiles.length > 0
            ? pair.sourceFiles
            : [pair.sourceFile || "unknown"]
        };
      });
    }

    function initializeDeck(baseDeck) {
      defaultWords = cloneWords(baseDeck).map(function (word) {
        return {
          id: word.id,
          dutch: word.dutch,
          english: word.english,
          count: 0,
          exampleDutch: word.exampleDutch || "",
          sourceFile: word.sourceFile || "unknown",
          sourceFiles: Array.isArray(word.sourceFiles) && word.sourceFiles.length > 0
            ? [...word.sourceFiles]
            : [word.sourceFile || "unknown"]
        };
      });

      baseWords = applySavedCounts(defaultWords);
      selectedSources = new Set([ALL_SOURCE_VALUE]);
      renderSourceFilterOptions();
      resetSessionTracking();
      resetQuizSessionStats();
      resetQuizQuestionState();
      applySourceFilter();
    }

    async function loadWordsFromDataFile() {
      try {
        const response = await fetch("./data/words.json", { cache: "no-store" });
        if (!response.ok) {
          throw new Error("Could not load data/words.json");
        }

        const jsonWords = await response.json();
        const cleanPairs = sanitizeWords(jsonWords);
        if (cleanPairs.length === 0) return;

        const loadedDeck = createWordObjectsFromPairs(cleanPairs);
        initializeDeck(loadedDeck);
      } catch (error) {
        console.warn("Using fallback words:", error);
      }
    }

    // ---------------------------------------------
    // Card + quiz rendering
    // ---------------------------------------------
    function getCurrentWord() {
      if (currentWordIndex < 0 || currentWordIndex >= words.length) return null;
      return words[currentWordIndex];
    }

    // ADDED (Quiz mode):
    // Normalizes answers for simple exact matching:
    // trim, lowercase, collapse repeated spaces.
    function normalizeAnswer(text) {
      return String(text || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, " ");
    }

    function resetQuizQuestionState() {
      isQuizChecked = false;
      wasQuizAnswerCorrect = false;
      quizAnswerInput.value = "";
      quizAnswerInput.readOnly = false;
      quizFeedback.textContent = "";
    }

    function resetQuizSessionStats() {
      quizCompletedCount = 0;
      quizCorrectCount = 0;
      quizWrongCount = 0;
      isQuizComplete = false;
    }

    function renderCard() {
      const currentWord = getCurrentWord();

      if (!currentWord) {
        dutchWord.textContent = "No words found";
        englishWord.textContent = "Check data/words.json";
        cardIndex.textContent = "Card 0 of 0";
        flashcard.classList.remove("is-flipped");
        return;
      }

      dutchWord.textContent = currentWord.dutch;
      englishWord.textContent = currentWord.english;
      cardIndex.textContent = `Card ${currentWordIndex + 1} of ${words.length}`;

      // Always reset to front side when card changes.
      flashcard.classList.remove("is-flipped");
    }

    function renderQuizPanel() {
      const currentWord = getCurrentWord();

      if (!currentWord) {
        quizDutchWord.textContent = "No words found";
        quizProgress.textContent = `Question 0 of ${QUIZ_SESSION_LENGTH}`;
        quizFeedback.textContent = "Add words to start the quiz.";
        quizAnswerInput.value = "";
        quizAnswerInput.disabled = true;
        quizAnswerInput.readOnly = true;
        checkAnswerBtn.disabled = true;
        quizCompleteBox.hidden = true;
        quizCompleteStats.textContent = "";
        return;
      }

      quizDutchWord.textContent = currentWord.dutch;

      const questionNumber = isQuizComplete
        ? QUIZ_SESSION_LENGTH
        : Math.min(quizCompletedCount + 1, QUIZ_SESSION_LENGTH);
      quizProgress.textContent = `Question ${questionNumber} of ${QUIZ_SESSION_LENGTH}`;

      if (isQuizChecked) {
        const resultText = wasQuizAnswerCorrect ? "Correct." : "Not correct.";
        quizFeedback.textContent = `${resultText} Correct answer: ${currentWord.english}`;
      } else {
        quizFeedback.textContent = "";
      }

      quizAnswerInput.disabled = isQuizComplete;
      quizAnswerInput.readOnly = isQuizChecked || isQuizComplete;
      checkAnswerBtn.disabled = isQuizChecked || isQuizComplete;
      quizCompleteBox.hidden = !isQuizComplete;

      if (isQuizComplete) {
        // Show final score for the 10-question session.
        quizCompleteStats.textContent = `Correct: ${quizCorrectCount} • Wrong: ${quizWrongCount}`;
      } else {
        quizCompleteStats.textContent = "";
      }
    }

    function updateModeUi() {
      const isQuizMode = currentMode === "quiz";

      cardScene.hidden = isQuizMode;
      quizPanel.hidden = !isQuizMode;
      cardIndex.hidden = isQuizMode;

      flashcardModeBtn.classList.toggle("is-active", !isQuizMode);
      quizModeBtn.classList.toggle("is-active", isQuizMode);

      if (isQuizMode) {
        prevBtn.disabled = true;
        nextBtn.disabled = !isQuizChecked || isQuizComplete || words.length === 0;
        nextTimeBtn.disabled = !isQuizChecked || isQuizComplete || words.length === 0;
      } else {
        prevBtn.disabled = shownHistoryIds.length <= 1 || words.length === 0;
        nextBtn.disabled = words.length === 0;
        nextTimeBtn.disabled = words.length === 0;
      }
    }

    function renderCurrentView() {
      renderCard();
      renderQuizPanel();
      renderExample();
      updateModeUi();
    }

    // ADDED (Example sentences):
    // Shows Dutch example only when reveal state is true.
    function renderExample() {
      const currentWord = getCurrentWord();

      if (!isExampleVisible || !currentWord) {
        exampleBox.hidden = true;
        exampleText.textContent = "";
        return;
      }

      exampleText.textContent =
        currentWord.exampleDutch && currentWord.exampleDutch.trim()
          ? currentWord.exampleDutch
          : "Geen voorbeeldzin beschikbaar.";
      exampleBox.hidden = false;
    }

    // ADDED (Example sentences):
    // Reveals sentence for current word (does not change word/card side).
    function showExampleSentence() {
      isExampleVisible = true;
      renderExample();
    }

    function showWordAtIndex(index, options) {
      if (words.length === 0) {
        renderCurrentView();
        return;
      }

      const config = options || {};
      const trackHistory = config.trackHistory !== false;
      const trackRecent = config.trackRecent !== false;

      let safeIndex = index;
      if (safeIndex < 0 || safeIndex >= words.length) safeIndex = 0;

      currentWordIndex = safeIndex;

      const currentWord = getCurrentWord();
      if (!currentWord) {
        renderCurrentView();
        return;
      }

      if (trackHistory) pushShownHistory(currentWord.id);
      if (trackRecent) pushRecentWord(currentWord.id);

      // ADDED (Example sentences):
      // Reset reveal state whenever moving to a different word.
      isExampleVisible = false;

      // ADDED (Quiz mode):
      // Reset checked state whenever moving to a new word/question.
      resetQuizQuestionState();

      renderCurrentView();
    }

    function pickNextWordIndexWeighted() {
      if (words.length === 0) return -1;

      // Build buckets from current counts each time (derived, not stored permanently).
      const allBuckets = buildBucketsByWordIndex(words);

      // Cooldown rule:
      // Prefer words not in recentWordIds when alternatives exist.
      const nonRecentBuckets = { 1: [], 2: [], 3: [] };

      [1, 2, 3].forEach(function (bucketId) {
        nonRecentBuckets[bucketId] = allBuckets[bucketId].filter(function (index) {
          return !recentWordIds.includes(words[index].id);
        });
      });

      const hasNonRecentOptions = [1, 2, 3].some(function (bucketId) {
        return nonRecentBuckets[bucketId].length > 0;
      });

      const bucketSource = hasNonRecentOptions ? nonRecentBuckets : allBuckets;
      const bucketId = pickWeightedBucketId(bucketSource);
      if (bucketId === null) return 0;

      return randomFromArray(bucketSource[bucketId]);
    }

    function goToWeightedNextWord() {
      const nextIndex = pickNextWordIndexWeighted();
      if (nextIndex < 0) return;
      showWordAtIndex(nextIndex, { trackHistory: true, trackRecent: true });
    }

    function flipCard() {
      if (currentMode !== "flashcard") return;
      flashcard.classList.toggle("is-flipped");
    }

    function showPreviousCard() {
      if (currentMode !== "flashcard") return;
      if (shownHistoryIds.length <= 1 || words.length === 0) return;

      // Remove current item and go back to previous shown word.
      shownHistoryIds.pop();
      const previousWordId = shownHistoryIds[shownHistoryIds.length - 1];
      const previousIndex = words.findIndex(function (word) {
        return word.id === previousWordId;
      });

      if (previousIndex === -1) return;

      // Do not push into history again while going backward.
      showWordAtIndex(previousIndex, { trackHistory: false, trackRecent: false });
    }

    // ---------------------------------------------
    // Learning actions
    // ---------------------------------------------
    function completeQuizStepAndMoveForward() {
      // Track quiz score based on the checked answer.
      if (wasQuizAnswerCorrect) {
        quizCorrectCount += 1;
      } else {
        quizWrongCount += 1;
      }

      quizCompletedCount += 1;

      // ADDED (Quiz mode):
      // Stop the current session exactly at QUIZ_SESSION_LENGTH questions.
      if (quizCompletedCount >= QUIZ_SESSION_LENGTH) {
        isQuizComplete = true;
        renderCurrentView();
        return;
      }

      // Quiz mode uses the same weighted bucket scheduler as flashcard mode.
      goToWeightedNextWord();
    }

    // "Next" means success: increment count.
    function handleKnownWord() {
      const currentWord = getCurrentWord();
      if (!currentWord) return;
      if (currentMode === "quiz" && (!isQuizChecked || isQuizComplete)) return;

      // Count logic:
      // "Next" means "I knew it", so increment count.
      currentWord.count += 1;
      saveProgress();

      if (currentMode === "quiz") {
        completeQuizStepAndMoveForward();
      } else {
        goToWeightedNextWord();
      }
    }

    // "Next time!" means failure: reset count to 0.
    function handleNeedsPractice() {
      const currentWord = getCurrentWord();
      if (!currentWord) return;
      if (currentMode === "quiz" && (!isQuizChecked || isQuizComplete)) return;

      // Count logic:
      // "Next time!" means "I need more practice", so reset count.
      currentWord.count = 0;
      saveProgress();

      if (currentMode === "quiz") {
        completeQuizStepAndMoveForward();
      } else {
        goToWeightedNextWord();
      }
    }

    // ---------------------------------------------
    // Quiz mode actions
    // ---------------------------------------------
    function checkQuizAnswer() {
      if (currentMode !== "quiz" || isQuizComplete) return;

      const currentWord = getCurrentWord();
      if (!currentWord) return;

      // Compare user answer using normalized text.
      const userAnswer = normalizeAnswer(quizAnswerInput.value);
      const expectedAnswer = normalizeAnswer(currentWord.english);

      isQuizChecked = true;
      wasQuizAnswerCorrect = userAnswer === expectedAnswer;
      quizAnswerInput.readOnly = true;

      renderCurrentView();
    }

    function switchMode(nextMode) {
      if (nextMode !== "flashcard" && nextMode !== "quiz") return;
      if (currentMode === nextMode) return;

      // Mode toggle: switch between flashcard and quiz views.
      currentMode = nextMode;

      // ADDED (Quiz mode):
      // Entering quiz resets the current question state (input/feedback/check flag),
      // but keeps the current word and current quiz progress count.
      if (currentMode === "quiz") {
        resetQuizQuestionState();
      }

      renderCurrentView();
    }

    function restartQuizSession() {
      // ADDED (Quiz mode):
      // Start a fresh 10-question session from the current deck state.
      resetQuizSessionStats();
      resetQuizQuestionState();

      if (words.length === 0) {
        renderCurrentView();
        return;
      }

      goToWeightedNextWord();
    }

    // ---------------------------------------------
    // Existing extra features
    // ---------------------------------------------
    function fisherYatesShuffle(list) {
      const shuffled = [...list];

      for (let i = shuffled.length - 1; i > 0; i--) {
        const randomIndex = Math.floor(Math.random() * (i + 1));
        const temp = shuffled[i];
        shuffled[i] = shuffled[randomIndex];
        shuffled[randomIndex] = temp;
      }

      return shuffled;
    }

    function shuffleCards() {
      if (words.length === 0) return;
      words = fisherYatesShuffle(words);
      resetSessionTracking();
      showWordAtIndex(0, { trackHistory: true, trackRecent: true });
    }

    function resetProgress() {
      const shouldReset = confirm("Reset all word counts back to 0?");
      if (!shouldReset) return;

      localStorage.removeItem(PROGRESS_STORAGE_KEY);
      baseWords = cloneWords(defaultWords);
      applySourceFilter();
    }

    // ---------------------------------------------
    // Event listeners
    // ---------------------------------------------
    flashcard.addEventListener("click", flipCard);
    flashcardModeBtn.addEventListener("click", function () {
      switchMode("flashcard");
    });
    quizModeBtn.addEventListener("click", function () {
      switchMode("quiz");
    });
    checkAnswerBtn.addEventListener("click", checkQuizAnswer);
    restartQuizBtn.addEventListener("click", restartQuizSession);
    prevBtn.addEventListener("click", showPreviousCard);
    shuffleBtn.addEventListener("click", shuffleCards);
    nextBtn.addEventListener("click", handleKnownWord);
    nextTimeBtn.addEventListener("click", handleNeedsPractice);
    resetProgressBtn.addEventListener("click", resetProgress);
    themeToggleBtn.addEventListener("click", toggleTheme);
    exampleBtn.addEventListener("click", showExampleSentence);
    sourceFilterOptions.addEventListener("change", handleSourceFilterChange);

    // Optional keyboard support for flip.
    flashcard.addEventListener("keydown", function (event) {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        flipCard();
      }
    });

    // Optional keyboard support for quiz:
    // Press Enter in the input to run Check.
    quizAnswerInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        event.preventDefault();
        checkQuizAnswer();
      }
    });

    // ---------------------------------------------
    // Startup
    // ---------------------------------------------
    loadSavedTheme();
    initializeDeck(fallbackWords);
    loadWordsFromDataFile();
  </script>
</body>
</html>
